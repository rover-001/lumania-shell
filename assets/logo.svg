<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cosmic Space Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1626"/>
      <stop offset="60%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>

    <!-- Pure Luminous White Moon Crescent Gradient -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#e6e8ee"/>
    </linearGradient>

    <!-- Earthshine / Dark Side Moon Fill -->
    <radialGradient id="darkSide" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1d1e28"/>
      <stop offset="70%" stop-color="#13141c"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </radialGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64dfdf" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b83b5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb88c" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Halo Glow Filters -->
    <filter id="moonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="craterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Canvas (Borderless) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#spaceGrad)"/>

  <!-- The Celestial Moon Group -->
  <g transform="translate(256, 256)">
    <!-- Earthshine (Full Disc Silhouette) -->
    <circle cx="0" cy="0" r="148" fill="url(#darkSide)"/>

    <!-- Subtle Crater Topography on Dark Side -->
    <circle cx="-55" cy="-42" r="26" fill="#181923" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.08"/>
    <circle cx="-38" cy="48" r="34" fill="#181923" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.08"/>
    <circle cx="-85" cy="18" r="18" fill="#181923" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.08"/>
    <circle cx="8" cy="-80" r="19" fill="#181923" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.08"/>

    <!-- The Radiant Crescent (Lumen Arc) with Glow Bloom -->
    <!-- Outer Arc radius 148, Inner Cutting Arc offset to reveal beautiful crescent -->
    <path d="M 0 -148
             A 148 148 0 0 1 128 74
             A 148 148 0 0 1 0 148
             A 136 136 0 0 0 74 0
             A 136 136 0 0 0 0 -148 Z"
          fill="url(#moonGlow)"
          filter="url(#moonBloom)"/>

    <!-- Bright Crescent Core Highlight -->
    <path d="M 38 -124
             A 140 140 0 0 1 122 55
             A 120 120 0 0 0 65 -35
             A 120 120 0 0 0 38 -124 Z"
          fill="#ffffff"
          opacity="0.85"/>

    <!-- Minimalist Dynamic Island Pill Integrated at Moon's Orbit -->
    <g transform="translate(-52, -186)">
      <rect x="0" y="0" width="104" height="28" rx="14" fill="#111218" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.22" filter="url(#craterGlow)"/>
      <circle cx="20" cy="14" r="4.5" fill="#f08a5d"/>
      <circle cx="20" cy="14" r="2" fill="#ffffff"/>
      <rect x="42" y="10" width="20" height="8" rx="4" fill="#ffffff" fill-opacity="0.85"/>
      <circle cx="84" cy="14" r="4" fill="#64dfdf"/>
    </g>
  </g>
</svg>
